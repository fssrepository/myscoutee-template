name: Template Pages
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [frontend, tools/sources/frontend.bundle, tools/bootstrap-submodules.sh, .github/workflows/pages.yml]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: template-pages
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize pinned local frontend and remote components
        run: tools/bootstrap-submodules.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Frontend checks
        run: npm --prefix frontend test -- --watch=false
      - name: Build static local-mode application
        run: npm --prefix frontend run build:github
        env:
          MYSCOUTEE_VERSION: 1.0.0
          NODE_OPTIONS: --max-old-space-size=3072
      - name: Verify release identity and Pages entry assets
        run: |
          node -e "const fs=require('fs');const p='frontend/docs/';if(JSON.parse(fs.readFileSync(p+'app-version.json')).version!=='1.0.0')throw Error('Version mismatch');for(const f of ['index.html','404.html','app-sw.js','manifest.webmanifest','favicon.ico'])if(!fs.statSync(p+f).isFile())throw Error('Missing '+f);if(!fs.readFileSync(p+'index.html','utf8').includes('<base href=\"/myscoutee-template/\">'))throw Error('Wrong Pages base path')"
          touch frontend/docs/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/docs
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
