sonar.projectKey=myscoutee-template-frontend
sonar.projectName=MyScoutee Template Frontend
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,src/secrets/**,src/assets/**
sonar.typescript.tsconfigPaths=tsconfig.app.json,tsconfig.spec.json
sonar.javascript.node.maxspace=2048
sonar.testExecutionReportPaths=test-results/sonar.xml
sonar.javascript.lcov.reportPaths=coverage/myscoutee/lcov.info
