    # Independent host reader: the application API may be unavailable during install.
    # The short-lived, job-scoped bearer is issued only after Operator approval.
    location ^~ /operator-update-status/ {
        limit_except GET { deny all; }
        proxy_pass http://unix:/run/myscoutee-update-status/status.sock;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_buffering off;
        access_log off;
        add_header Cache-Control "no-store" always;
    }
