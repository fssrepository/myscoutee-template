upstream mongodb_tcp {
    zone mongodb_tcp 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    server mongodb:27017 resolve;
}

server {
    listen 27017;
    proxy_pass mongodb_tcp;

    #https://www.arin.net/reference/research/statistics/address_filters/
    #allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny all;
}