include /etc/nginx/myscoutee/modules-main.conf;

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  16384;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}


http {
    include /etc/nginx/myscoutee/request-policy-http.conf;
    include /etc/nginx/myscoutee/observability-http.conf;
    include /etc/nginx/myscoutee/runtime-internal.conf;
    myscoutee_partition_file /etc/nginx/countryPartitions.json;
    limit_req_zone $binary_remote_addr zone=mcp_registration:1m rate=6r/m;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;


    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    gzip  on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    include /etc/nginx/conf.d/http-transport-policy.conf;
    include /etc/nginx/conf.d/spring.conf;
}

stream {
    include /etc/nginx/stream_conf.d/*.conf;
}
