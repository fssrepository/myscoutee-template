include /etc/nginx/myscoutee/modules-main.conf;

# Lab ingress around the existing production frontend image. No frontend build.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 256; }
http {
    myscoutee_partition_file /etc/nginx/countryPartitions.json;
    include /etc/nginx/myscoutee/request-policy-http.conf;
    include /etc/nginx/myscoutee/observability-http.conf;
    include /etc/nginx/myscoutee/runtime-internal.conf;
    include /etc/nginx/mime.types;

    gzip  on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    limit_req_zone $binary_remote_addr zone=mcp_registration:1m rate=6r/m;
    map $uri $metrics_backend {
        default "";
        @METRICS_UPSTREAMS@
    }
    # Host monitoring reaches this guest-only NodePort. Business/internal APIs
    # cannot be routed through this listener; the public listener denies metrics.
    server {
        listen 8082;
        resolver @CLUSTER_DNS@ valid=30s ipv6=off;
        location /metrics/ {
            if ($metrics_backend = "") { return 404; }
            rewrite ^ /metrics break;
            proxy_pass http://$metrics_backend;
            proxy_connect_timeout 1s;
            proxy_read_timeout 4s;
        }
        location / { return 404; }
    }
    # Specific routes precede their owning broader prefix. Paths mirror the
    # canonical public controllers; internal and repository routes stay private.
    map $uri $backend {
        default "";
        @PUBLIC_UPSTREAMS@
    }
    server {
        listen 8080;
        include /etc/nginx/myscoutee/request-policy-server.conf;
        server_name localhost;
        root /usr/share/nginx/html;
        client_max_body_size 10m;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-MyScoutee-Pod $hostname always;
        include /etc/myscoutee/response-policy.conf;
        # The kubelet writes the cluster DNS resolver into this pod's resolv.conf;
        # the deployment renderer inserts that cluster's actual DNS Service IP.
        resolver @CLUSTER_DNS@ valid=30s ipv6=off;
        include /etc/myscoutee/runtime-status.conf;
        # Retain the monolith's public Spring health contract. Expose this exact
        # endpoint only; aggregate availability remains /api/runtime-status.
        location = /api/health {
            limit_except GET { deny all; }
            set $health_backend identity.@NAMESPACE@.svc.cluster.local:8081;
            proxy_pass http://$health_backend/health;
            proxy_connect_timeout 1s;
            proxy_read_timeout 4s;
        }
@PAYMENT_PROVIDER_LOCATIONS@
        location ~ ^/mcp(?:/private)?$ {
            set $mcp_backend mcp.@NAMESPACE@.svc.cluster.local:8080;
            proxy_pass http://$mcp_backend;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            client_max_body_size 1m;
            proxy_read_timeout 60s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /.well-known/oauth-authorization-server {
            set $identity_backend identity.@NAMESPACE@.svc.cluster.local:8080;
            proxy_pass http://$identity_backend/mcp/oauth/metadata;
        }
        location ~ ^/\.well-known/oauth-protected-resource(?:/mcp/private)?$ {
            set $identity_backend identity.@NAMESPACE@.svc.cluster.local:8080;
            proxy_pass http://$identity_backend/mcp/oauth/resource;
        }
        location = /api/mcp/oauth/register {
            client_max_body_size 16k;
            limit_req zone=mcp_registration burst=5 nodelay;
            limit_req_status 429;
            set $identity_backend identity.@NAMESPACE@.svc.cluster.local:8080;
            proxy_pass http://$identity_backend/mcp/oauth/register;
        }
        location = /api/mcp/oauth/token {
            client_max_body_size 16k;
            set $identity_backend identity.@NAMESPACE@.svc.cluster.local:8080;
            proxy_pass http://$identity_backend/mcp/oauth/token;
        }
        # Match the canonical monolith socket timeout; an idle video call must
        # not inherit the ordinary 30-second HTTP response timeout.
        location ~ ^/api/(?:activities/chats|admin/notifications)/ws$ {
            include /etc/myscoutee/public-upstream.conf;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /api/ {
            include /etc/myscoutee/public-upstream.conf;
            proxy_read_timeout 30s;
        }
        location = /media/public {
            set $media_backend @MEDIA_SERVICE@.@NAMESPACE@.svc.cluster.local:8080;
            proxy_pass http://$media_backend;
        }
        location ~ ^/(?:_internal|metrics|health|backend)(?:/|$) { return 404; }
        location = /app-sw.js {
            try_files $uri =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            include /etc/myscoutee/response-policy.conf;
        }
        # Reuse the canonical monolith policy for content-hashed JS/CSS.
        location ~* ^/.+-[A-Za-z0-9_-]+\.(?:js|css)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/myscoutee/response-policy.conf;
        }
        # Match the canonical monolith cache policy for emitted fonts and branding.
        location ~* "^/media/[^/]+-[A-Za-z0-9]{8}\.woff2?$" {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/myscoutee/response-policy.conf;
        }
        location ~* ^/assets/(?:logo|icon|idea)/.*\.(?:png|webp|svg|ico)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=2592000";
            include /etc/myscoutee/response-policy.conf;
        }
        location ~* \.(?:js|css|wasm|png|svg|ico|webmanifest)$ { try_files $uri =404; }
        location / {
            ssi on;
            ssi_silent_errors on;
            # The public app shell must revalidate without blocking bfcache.
            add_header Cache-Control "no-cache" always;
            include /etc/myscoutee/response-policy.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
