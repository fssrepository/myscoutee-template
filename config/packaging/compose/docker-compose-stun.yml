# Shared STUN-only service: no TURN allocation and no media relay ports.
services:
  stun:
    image: coturn/coturn:4.18.0-r0-alpine
    restart: "no"
    # The image wrapper evaluates `echo -n` and loses this first option.
    # Invoke the same binary directly so --no-config (-n) is preserved.
    entrypoint: ["/usr/bin/turnserver"]
    command:
      - -n
      - --stun-only
      - --no-auth
      - --no-tls
      # DTLS, CLI and RFC 5780 are disabled by default in coturn 4.18.
      - --relay-threads=1
      - --listening-ip=0.0.0.0
      - --listening-port=3478
      - --realm=myscoutee
      - --log-file=stdout
      - --simple-log
      - --pidfile=/tmp/turnserver.pid
    ports:
      - "${CHAT_CALL_STUN_PORT:-3478}:3478/udp"
      - "${CHAT_CALL_STUN_PORT:-3478}:3478/tcp"
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/coturn
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
