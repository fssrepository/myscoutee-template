def backendRoot = file(providers.gradleProperty('backendSourceDir')
    .orElse(providers.environmentVariable('MYSCOUTEE_BACKEND_SOURCE'))
    .orElse(settingsDir.parentFile.absolutePath).get()).canonicalFile
if (!new File(backendRoot, 'server/gradle/libs.versions.toml').isFile()) {
    throw new GradleException("Compatible backend source not found at ${backendRoot}; set MYSCOUTEE_BACKEND_SOURCE.")
}
gradle.ext.microservicesBackendRoot = backendRoot
dependencyResolutionManagement {
    versionCatalogs {
        libs { from(files(new File(backendRoot, 'server/gradle/libs.versions.toml'))) }
    }
}
include('contracts', 'bootstrap-tests')
def assembly = new groovy.json.JsonSlurper().parse(file('assemblies.json'))
rootProject.name = assembly.projectName
def domainRoot = new File(backendRoot, 'server/projects/profile/src/main/java/com/raxim/myscoutee/domain')
def expectedDomains = domainRoot.listFiles().findAll { it.directory }.collect { it.name }.toSet()
def assignedDomains = assembly.services.values().collectMany { it.domains }
if (assignedDomains.size() != assignedDomains.toSet().size() || assignedDomains.toSet() != expectedDomains) {
    throw new GradleException('assemblies.json must assign every canonical domain to exactly one service.')
}
assembly.services.keySet().each { name ->
    if (!(name ==~ /[a-z][a-z0-9-]*/)) throw new GradleException("Invalid service name: ${name}")
    include(name)
    def descriptor = file("build/projects/${name}")
    descriptor.mkdirs()
    project(":${name}").projectDir = descriptor
}
