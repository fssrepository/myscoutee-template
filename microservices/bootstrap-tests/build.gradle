sourceSets.main.java {
    srcDir rootProject.backendJava
    srcDir rootProject.file('bootstrap/src/main/java')
    srcDir rootProject.file('transport/src/main/java')
    include '**/ServiceSecurityConfiguration.java'
    include '**/ChatWebSocketTransportConfiguration.java'
    include '**/PolicyAuthorizationConfiguration.java'
    include 'com/raxim/myscoutee/common/security/policy/**'
    include '**/transport/**'
}
sourceSets.test.java {
    srcDir rootProject.backendJava
    include 'com/raxim/myscoutee/microservices/**'
    include 'com/raxim/myscoutee/common/config/mongo/MongoChangeStreamService.java'
    include 'com/raxim/myscoutee/common/config/mongo/ScheduledMongoSessionRunner.java'
    include 'com/raxim/myscoutee/common/config/JsonConfig.java'
    include 'com/raxim/myscoutee/common/util/JsonUtil.java'
    include 'com/raxim/myscoutee/domain/platform/service/AppSettingsService.java'
    include 'com/raxim/myscoutee/domain/platform/document/AppSettings.java'
    include 'com/raxim/myscoutee/domain/platform/repository/AppSettingsRepository.java'
    include 'com/raxim/myscoutee/domain/chat/service/ChatDirectoryService.java'
    include 'com/raxim/myscoutee/domain/chat/repository/ChatsRepository.java'
    include 'com/raxim/myscoutee/domain/chat/document/Chat.java'
    include 'com/raxim/myscoutee/domain/chat/document/ChatMessage.java'
    include 'com/raxim/myscoutee/domain/localization/service/I18nService.java'
    include 'com/raxim/myscoutee/domain/localization/service/TranslationService.java'
    include 'com/raxim/myscoutee/domain/localization/service/DBMessageSource.java'
    include 'com/raxim/myscoutee/domain/localization/document/**'
    include 'com/raxim/myscoutee/domain/localization/repository/**'
    include 'com/raxim/myscoutee/domain/email/config/EmailProperties.java'
}

dependencies {
    implementation project(':contracts')
    implementation 'org.springframework:spring-tx'
    implementation 'org.mongodb:bson'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    testRuntimeOnly 'io.micrometer:micrometer-registry-prometheus'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    systemProperty 'wireEvidenceDirectory', layout.buildDirectory.dir('wire-evidence').get().asFile.absolutePath
}
jar { enabled = false }
