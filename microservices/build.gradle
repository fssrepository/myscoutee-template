import groovy.json.JsonSlurper

plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.dependency.management) apply false
}
ext.backendRoot = gradle.ext.microservicesBackendRoot
ext.backendJava = new File(backendRoot, 'server/projects/profile/src/main/java')
ext.backendResources = new File(backendRoot, 'server/projects/profile/src/main/resources')
ext.assemblyConfiguration = new JsonSlurper().parse(file('assemblies.json'))
ext.assemblies = assemblyConfiguration.services
ext.packageRoot = 'com/raxim/myscoutee/'
ext.transportUsage = new JsonSlurper().parseText(providers.exec {
    commandLine 'python3', file('tools/transport_usage.py'), projectDir, backendRoot
}.standardOutput.asText.get())

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply from: new File(rootProject.backendRoot, 'server/gradle/dependency-policy.gradle')
    group = 'com.raxim.myscoutee.microservices'
    version = rootProject.assemblyConfiguration.version
    layout.buildDirectory = rootProject.layout.buildDirectory.dir(name)
    repositories { mavenCentral() }
    java { toolchain { languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger()) } }
    dependencyManagement {
        imports { mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.get()}" }
    }
    tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-parameters'] }
}

project(':contracts') {
    sourceSets.main.java {
        srcDir rootProject.backendJava
        include 'com/raxim/myscoutee/domain/*/api/**'
        include 'com/raxim/myscoutee/domain/*/dto/**'
        include 'com/raxim/myscoutee/common/dto/**'
        include 'com/raxim/myscoutee/common/security/crypto/**'
        include 'com/raxim/myscoutee/common/security/http/HttpSecurityContribution.java'
        include 'com/raxim/myscoutee/common/measurement/EvidenceCursor.java'
        include 'com/raxim/myscoutee/common/measurement/MeasurementEvidence.java'
        include 'com/raxim/myscoutee/common/config/mongo/MongoSessionMode.java'
        include 'com/raxim/myscoutee/common/config/mongo/MongoSessionModeContext.java'
        // This DTO is used only inside community and intentionally contains owner documents.
        exclude 'com/raxim/myscoutee/domain/community/dto/CaseAppointmentDtos.java'
    }
    dependencies {
        compileOnly 'org.springframework.boot:spring-boot-starter-web'
        compileOnly 'org.springframework.boot:spring-boot-starter-data-mongodb'
        compileOnly 'org.springframework.boot:spring-boot-starter-security'
        compileOnly 'org.springframework.boot:spring-boot-starter-validation'
        compileOnly libs.firebase
        compileOnly libs.bouncycastle
    }
}

assemblies.each { serviceName, assembly ->
    project(":${serviceName}") {
        ext.assembly = assembly
        apply from: rootProject.file('build-logic/service.gradle')
    }
}

tasks.register('assembleServices') {
    group = 'build'
    description = 'Build the configured independent domain assemblies from canonical sources.'
    dependsOn assemblies.keySet().collect { ":${it}:bootJar" }
}
tasks.register('verifyAssemblies', Exec) {
    group = 'verification'
    dependsOn 'assembleServices', ':bootstrap-tests:test'
    environment 'MYSCOUTEE_BACKEND_SOURCE', backendRoot.absolutePath
    commandLine 'python3', file('tools/audit-assemblies.py'), '--artifacts'
}
