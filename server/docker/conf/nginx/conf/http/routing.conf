# Template routes selected from the native gateway.
# MCP transport is added with the MCP service in implementation step 12.

    location /api/activities/chats/ws {
        # Included from both the HTTP and HTTPS server blocks. The frontend picks
        # ws:// or wss:// from the current page protocol; nginx keeps the upgrade.
        proxy_pass http://profilemanagement:8080/activities/chats/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/admin/notifications/ws {
        # Included from both the HTTP and HTTPS server blocks. The frontend picks
        # ws:// or wss:// from the current page protocol; nginx keeps the upgrade.
        proxy_pass http://profilemanagement:8080/admin/notifications/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://profilemanagement:8080/;

        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://profilemanagement:8080/mcp/oauth/metadata;
    }

    location = /.well-known/oauth-protected-resource/mcp/private {
        proxy_pass http://profilemanagement:8080/mcp/oauth/resource;
    }

    location = /.well-known/oauth-protected-resource {
        proxy_pass http://profilemanagement:8080/mcp/oauth/resource;
    }

    location = /api/mcp/oauth/token {
        client_max_body_size 16k;
        proxy_pass http://profilemanagement:8080/mcp/oauth/token;
    }

    location = /api/mcp/oauth/register {
        client_max_body_size 16k;
        limit_req zone=mcp_registration burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://profilemanagement:8080/mcp/oauth/register;
    }

    include /etc/nginx/conf.d/runtime-status.conf;
