server {
    #https://pentacent.medium.com/nginx-and-lets-encrypt-with-docker-in-less-than-5-minutes-b4b8a60d3a71
    #https://www.howtogeek.com/101288/how-to-schedule-tasks-on-linux-an-introduction-to-crontab-files/
    #https://unix.stackexchange.com/questions/453006/getting-cron-to-work-on-docker
    #https://linuxhostsupport.com/blog/install-lets-encrypt-ssl-certificates-using-certbot/

    listen       80;
    server_name localhost;

    if ($myscoutee_http_redirect = 1) {
        return 308 https://$server_name$request_uri;
    }

    client_max_body_size 10M;

    #charset koi8-r;
    #access_log  /var/log/nginx/host.access.log  main;
    
    root   /usr/share/nginx/html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "UP\n";
    }

    location = /app-sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/conf.d/https-response-policy.conf;
    }

    location = /app-version.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/conf.d/https-response-policy.conf;
    }

    location ~* ^/.+-[A-Za-z0-9_-]+\.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/https-response-policy.conf;
    }

    location ~* \.(?:js|css|map|wasm)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/https-response-policy.conf;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/https-response-policy.conf;
    }

    location = /media/public {
        proxy_pass http://profilemanagement:8080/media/public;

        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* ^/assets/(?:logo|icon|idea)/.*\.(?:png|webp|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/conf.d/https-response-policy.conf;
    }

    location ~* ^/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/conf.d/https-response-policy.conf;
    }

    location / {
        ssi on;
        ssi_silent_errors on;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/conf.d/https-response-policy.conf;
    }

    include /etc/nginx/conf.d/routing.conf;
}

