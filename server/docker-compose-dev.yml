# Selected native dev services. Full template composition is in progress; see the numbered implementation plan.
networks:
  myscoutee:
    driver: bridge
services:
  mongodb:
    extends:
      file: docker-compose.replicaset.yml
      service: mongodb
    image: ${MONGO_IMAGE:-mongo:8.0.4}
    container_name: myscoutee-template-dev-mongodb
    hostname: mongodb
    env_file:
    - docker-dev.env
    environment:
      CHAT_CALL_STUN_URLS: ${CHAT_CALL_STUN_URLS:-}
      CHAT_CALL_STUN_PORT: ${CHAT_CALL_STUN_PORT:-3478}
      MONGO_INITDB_DATABASE: ${MONGO_DEMO_DATABASE}
      MONGO_APP_DATABASE: ${MONGO_DEMO_DATABASE}
      MONGO_SEED_DIRECTORY: demo_db
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
    - ./docker/conf/mongodb/:/docker-entrypoint-initdb.d
    - ./data/mongodb/demo-data-v8-0:/data/db
    - ./docker/scripts:/scripts
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    networks:
    - myscoutee
  mongodb-sync:
    image: ${MONGODB_SYNC_IMAGE:-myscoutee-template-mongodb-sync:1.0.0-dev}
    pull_policy: build
    build:
      context: .
      dockerfile: docker/images/mongodb-sync/dev/Dockerfile
      args:
        TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    container_name: myscoutee-template-dev-mongodb-sync
    hostname: mongodb-sync
    env_file:
    - docker-dev.env
    command:
    - /usr/local/bin/mongodb-seed-sync
    environment:
      MONGO_APP_DATABASE: ${MONGO_DEMO_DATABASE}
      MONGO_DEMO_DATABASE: ${MONGO_DEMO_DATABASE}
      MONGO_SEED_DIRECTORY: demo_db
      MONGODB_SEED_SYNC_DEBOUNCE_SECONDS: ${MONGODB_SEED_SYNC_DEBOUNCE_SECONDS:-1}
      MONGODB_SEED_SYNC_RECONCILE_SECONDS: ${MONGODB_SEED_SYNC_RECONCILE_SECONDS:-2}
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
    - ./docker/conf/mongodb:/docker-entrypoint-initdb.d:ro
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    networks:
    - myscoutee
    depends_on:
    - mongodb
  redis:
    image: ${REDIS_IMAGE:-redis:8.6.1-alpine}
    container_name: myscoutee-template-dev-redis
    hostname: redis
    environment:
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    networks:
    - myscoutee
  minio:
    image: ${MINIO_DEV_IMAGE:-myscoutee-template-minio:1.0.0-dev}
    pull_policy: build
    build:
      context: .
      dockerfile: docker/images/minio/Dockerfile
      args:
        MINIO_BASE_IMAGE: ${MINIO_BASE_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: myscoutee-template-dev-minio
    hostname: minio
    env_file:
    - docker-dev.env
    command: server /data --console-address ":9001"
    environment:
      MEDIA_BUCKET: ${MEDIA_BUCKET}
      MINIO_ENDPOINT: http://127.0.0.1:9000
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
    - ./data/minio:/data
    - ./docker/conf/minio:/seed:ro
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    networks:
    - myscoutee
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/myscoutee-minio-seeded && curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit
        1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
  profilemanagement:
    extends:
      file: docker-compose.replicaset.yml
      service: profilemanagement
    image: ${MYSCOUTEE_DEV_IMAGE:-myscoutee-template-api:1.0.0-dev}
    pull_policy: build
    build:
      context: .
      dockerfile: docker/images/profilemanagement/dev/Dockerfile
      args:
        TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    container_name: myscoutee-template-dev-profilemanagement
    hostname: myscoutee
    env_file:
    - docker-dev.env
    working_dir: /workspace
    user: ${UID:-1000}:${GID:-1000}
    command:
    - bash
    - -lc
    - /bin/sh /workspace/docker/scripts/ensure_operator_configuration_master_key.sh && exec bash /workspace/docker/scripts/start_profilemanagement_dev.sh
    environment:
      GRADLE_USER_HOME: /workspace/.gradle-docker
      PROFILEMANAGEMENT_HOT_RELOAD: ${PROFILEMANAGEMENT_HOT_RELOAD:-true}
      PROFILEMANAGEMENT_DEBUG_PORT: ${PROFILEMANAGEMENT_DEBUG_PORT:-5005}
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DEVTOOLS_RESTART_ENABLED: ${PROFILEMANAGEMENT_HOT_RELOAD:-true}
      MONGODB_HOST: mongodb
      MONGODB_DATABASE: ${MONGO_DEMO_DATABASE}
      MONGODB_DEMO_DATABASE: ${MONGO_DEMO_DATABASE}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: '6379'
      CHAT_STREAM_BLOCK_MS: ${CHAT_STREAM_BLOCK_MS:-10000}
      USERS_DELETED_ACCOUNT_PURGE_DELAY_MS: ${USERS_DELETED_ACCOUNT_PURGE_DELAY_MS:-60000}
      FIREBASE_ENABLED: 'false'
      AUTH_MAX_ACTIVE_SESSIONS: ${AUTH_MAX_ACTIVE_SESSIONS:--1}
      MEMBER_USER: ${MEMBER_USER:-member1@template.local}
      OPERATOR_USER: ${OPERATOR_USER:-operator@template.local}
      OPERATOR_CONFIGURATION_MASTER_KEY_PATH: /workspace/data/configuration/deployment-master-key
      MEDIA_ENABLED: 'true'
      MEDIA_OBJECT_STORE_ENDPOINT: http://minio:9000
      MEDIA_OBJECT_STORE_REGION: eu-central-1
      MEDIA_BUCKET: ${MEDIA_BUCKET}
      MEDIA_OBJECT_STORE_PATH_STYLE: 'true'
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
      JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED
      MYSCOUTEE_VERSION: ${MYSCOUTEE_VERSION:-1.0.0}
    ports:
    - 127.0.0.1:${PROFILEMANAGEMENT_DEBUG_PORT:-5005}:${PROFILEMANAGEMENT_DEBUG_PORT:-5005}
    volumes:
    - ./:/workspace
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    networks:
    - myscoutee
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c '>/dev/tcp/127.0.0.1/8080'
      interval: 2s
      timeout: 2s
      retries: 120
      start_period: 20s
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
name: myscoutee-template-dev
