# Selected native prod services. Full template composition is in progress; see the numbered implementation plan.
name: myscoutee-template-prod
networks:
  myscoutee:
    driver: bridge
secrets:
  firebase-service-account:
    file: ./projects/profile/secrets/firebase-service-account.json
services:
  mongodb:
    extends:
      file: docker-compose.replicaset.yml
      service: mongodb
    image: ${MONGO_IMAGE:-mongo:8.0.4}
    container_name: myscoutee-template-prod-mongodb
    hostname: mongodb
    restart: unless-stopped
    env_file:
    - .env.secrets
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_REAL_DATABASE}
      MONGO_APP_DATABASE: ${MONGO_REAL_DATABASE}
      MONGO_SEED_DIRECTORY: myscoutee_db
      MONGO_IMPORT_ALL_SEED_DATABASES: 'true'
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
    - ./docker/conf/mongodb/:/docker-entrypoint-initdb.d
    - ./data/mongodb/data-v8-0:/data/db
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    networks:
    - myscoutee
    healthcheck:
      test:
      - CMD
      - bash
      - /docker-entrypoint-initdb.d/replica-health
      interval: 30s
      timeout: 10s
      retries: 5
      start_interval: 2s
      start_period: 30s
  redis:
    image: ${REDIS_IMAGE:-redis:8.6.1-alpine}
    container_name: myscoutee-template-prod-redis
    hostname: redis
    restart: unless-stopped
    environment:
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    networks:
    - myscoutee
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping | grep -q PONG
      interval: 30s
      timeout: 5s
      retries: 5
      start_interval: 2s
      start_period: 10s
  minio:
    image: ${MINIO_PRODUCTION_IMAGE:-myscoutee-template-minio:1.0.0-prod}
    pull_policy: build
    build:
      context: .
      dockerfile: docker/images/minio/Dockerfile
      args:
        MINIO_BASE_IMAGE: ${MINIO_BASE_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: myscoutee-template-prod-minio
    hostname: minio
    restart: unless-stopped
    env_file:
    - .env.secrets
    command: server /data --console-address ":9001"
    environment:
      MEDIA_BUCKET: ${MEDIA_BUCKET}
      MINIO_ENDPOINT: http://127.0.0.1:9000
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    volumes:
    - ./data/minio:/data
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    networks:
    - myscoutee
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/myscoutee-minio-seeded && curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit
        1
      interval: 30s
      timeout: 5s
      retries: 5
      start_interval: 2s
      start_period: 20s
  profilemanagement:
    extends:
      file: docker-compose.replicaset.yml
      service: profilemanagement
    image: ${MYSCOUTEE_PRODUCTION_IMAGE:-myscoutee-template-api:1.0.0-prod}
    pull_policy: build
    restart: unless-stopped
    build:
      context: projects/profile/build/libs
      dockerfile: ../../../../docker/images/profilemanagement/prod/Dockerfile
      args:
        TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
    container_name: myscoutee-template-prod-profilemanagement
    hostname: myscoutee
    env_file:
    - .env.secrets
    environment:
      EMAIL_BASE_URL: ${EMAIL_BASE_URL:-http://localhost}
      SENDGRID_ENDPOINT: ${SENDGRID_ENDPOINT:-https://api.sendgrid.com/v3/mail/send}
      CHAT_CALL_STUN_URLS: ${CHAT_CALL_STUN_URLS:-}
      CHAT_CALL_STUN_PORT: ${CHAT_CALL_STUN_PORT:-3478}
      SPRING_PROFILES_ACTIVE: prod
      MYSCOUTEE_VERSION: ${MYSCOUTEE_VERSION:-1.0.0}
      MONGODB_HOST: mongodb
      MONGODB_DATABASE: ${MONGO_REAL_DATABASE}
      MONGODB_DEMO_DATABASE: ${MONGO_DEMO_DATABASE}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: '6379'
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-true}
      AUTH_MAX_ACTIVE_SESSIONS: ${AUTH_MAX_ACTIVE_SESSIONS:--1}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      MEMBER_USER: ''
      OPERATOR_USER: ${OPERATOR_USER:-}
      OPERATOR_CONFIGURATION_MASTER_KEY_PATH: /etc/myscoutee/configuration/deployment-master-key
      WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:-https://localhost,https://127.0.0.1,http://localhost:8080,http://127.0.0.1:8080}
      MEDIA_ENABLED: 'true'
      MEDIA_OBJECT_STORE_ENDPOINT: http://minio:9000
      MEDIA_OBJECT_STORE_REGION: eu-central-1
      MEDIA_BUCKET: ${MEDIA_BUCKET}
      MEDIA_OBJECT_STORE_PATH_STYLE: 'true'
      TZ: ${CONTAINER_TIMEZONE:-Europe/Brussels}
      JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED -XX:+ExitOnOutOfMemoryError
    secrets:
    - source: firebase-service-account
      target: firebase-service-account.json
    volumes:
    - ${OPERATOR_CONFIGURATION_KEY_DIR_HOST:-./data/configuration}:/etc/myscoutee/configuration:ro
    - ${REGISTRY_KEY_DIR_HOST:-./data/registry-keys}:/etc/myscoutee/registry:rw
    - ${REGISTRY_STATE_DIR_HOST:-./data/registry}:/var/lib/myscoutee/registry
    - ${MYSCOUTEE_UPDATE_STATE_DIR_HOST:-./data/update}/inbox/staging:/var/lib/myscoutee/update/staging:rw
    - ${MYSCOUTEE_UPDATE_STATE_DIR_HOST:-./data/update}/inbox/requests:/var/lib/myscoutee/update/requests:rw
    - ${MYSCOUTEE_UPDATE_STATE_DIR_HOST:-./data/update}/runtime/jobs:/var/lib/myscoutee/update/jobs:ro
    - ${MYSCOUTEE_UPDATE_CONFIG_DIR_HOST:-./data/update-config}:/etc/myscoutee/update:ro
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    networks:
    - myscoutee
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/health | grep -q UP
      interval: 30s
      timeout: 5s
      retries: 8
      start_interval: 2s
      start_period: 60s
